<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Fiş Toplama</title>
  <link rel="stylesheet" href="/assets/style.css?v=9">
</head>
<body>

<section id="authView" class="auth-view">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">F</div>
      <div>
        <h1>Fiş Toplama</h1>
        <p>Giriş yap</p>
      </div>
    </div>
    <form id="loginForm">
      <label>E-posta
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>Şifre
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="loginBtn" class="button primary wide" type="submit">Giriş Yap</button>
      <div id="authError" class="auth-error"></div>
    </form>
  </div>
</section>

<div id="appView" class="hidden app-shell">

  <header class="topbar">
    <div class="brand">
      <div class="logo">F</div>
      <h1>Fiş Toplama</h1>
    </div>
    <div class="top-actions">
      <div id="apiStatus" class="status" title="Tarama servisi"><span></span></div>
      <div id="userEmail" class="user-email"></div>
      <button id="logoutBtn" class="logout-btn" type="button">Çıkış</button>
    </div>
  </header>

  <main class="container">

    <!-- ANA SAYFA -->
    <section class="page active" data-page="home">

      <section class="home-hero">
        <div class="hero-copy">
          <span class="hero-kicker">FIŞ TOPLAMA</span>
          <h2>Fişlerini tara,<br>PDF'ini hazırla.</h2>

          <div class="hero-actions">
            <button class="button hero-primary" type="button" data-go="scan">+ Yeni Fiş Tara</button>
            <button class="button hero-secondary" type="button" data-go="pdf">PDF Oluştur</button>
          </div>
        </div>

        <div class="hero-stats">
          <div class="hero-stat">
            <span>Toplam Fiş</span>
            <strong id="homeReceiptCount">0</strong>
          </div>
          <div class="hero-stat">
            <span>Bugün</span>
            <strong id="homeTodayCount">0</strong>
          </div>
          <div class="hero-stat">
            <span>PDF</span>
            <strong id="homePdfCount">0</strong>
          </div>
        </div>
      </section>

      <section class="home-shortcuts">
        <button class="shortcut-card scan-shortcut" type="button" data-go="scan">
          <span class="shortcut-icon">⌁</span>
          <span class="shortcut-copy">
            <strong>Fiş Tara</strong>
            <small>Kamera veya galeri</small>
          </span>
          <span class="shortcut-arrow">›</span>
        </button>

        <button class="shortcut-card" type="button" data-go="pdf">
          <span class="shortcut-icon">▤</span>
          <span class="shortcut-copy">
            <strong>PDF Oluştur</strong>
            <small><b id="homeSelectedCount">0</b> fiş seçili</small>
          </span>
          <span class="shortcut-arrow">›</span>
        </button>

        <button class="shortcut-card" type="button" data-go="archive">
          <span class="shortcut-icon">⌗</span>
          <span class="shortcut-copy">
            <strong>PDF Arşivi</strong>
            <small>Kaydedilen dosyalar</small>
          </span>
          <span class="shortcut-arrow">›</span>
        </button>
      </section>

      <section class="home-recent-section">
        <div class="home-section-head">
          <div>
            <span class="eyebrow">SON TARAMALAR</span>
            <h3>En son eklenenler</h3>
          </div>
          <button class="text-btn" type="button" data-go="pdf">Tümünü Gör</button>
        </div>

        <div id="homeRecent" class="home-recent"></div>
      </section>

    </section>

    <!-- TARA -->
    <section class="page" data-page="scan">
      <section class="panel compact-panel">
        <div class="section-head">
          <div>
            <span class="eyebrow">TARAMA</span>
            <h2>Yeni Fiş</h2>
          </div>
        </div>

        <div class="form-grid">
          <label>Şube
            <input id="branch" placeholder="İsteğe bağlı">
          </label>
          <label>Not
            <input id="note" placeholder="İsteğe bağlı">
          </label>
        </div>

        <div class="actions scan-buttons">
          <label class="button primary" for="cameraInput">Kameradan Çek</label>
          <label class="button secondary" for="galleryInput">Galeriden Seç</label>
          <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
          <input id="galleryInput" type="file" accept="image/*" multiple hidden>
        </div>

        <div id="dropZone" class="dropzone">
          <strong>Fotoğrafı buraya bırak</strong>
        </div>
      </section>

      <section id="queuePanel" class="panel hidden">
        <div class="section-head">
          <h2>İşlemler</h2>
          <button id="clearDone" class="text-btn" type="button">Temizle</button>
        </div>
        <div id="queue" class="queue"></div>
      </section>
    </section>

    <!-- PDF -->
    <section class="page" data-page="pdf">
      <section class="panel">
        <div class="section-head results-head">
          <div>
            <span class="eyebrow">PDF</span>
            <h2>Fiş Seç</h2>
            <p><b id="count">0</b> fiş</p>
          </div>

          <div class="pdf-actions">
            <button id="selectAll" class="button secondary small" type="button">Tümünü Seç</button>
            <button id="deleteSelected" class="button danger small" type="button" disabled>Seçilenleri Sil</button>
          </div>
        </div>

        <div id="empty" class="empty">
          <div>▤</div>
          <strong>Henüz fiş yok</strong>
          <button class="button primary small" type="button" data-go="scan">Fiş Tara</button>
        </div>

        <div id="grid" class="grid"></div>
      </section>

      <div class="pdf-sticky">
        <div>
          <span>Seçili</span>
          <strong><span id="selectedCount">0</span> fiş</strong>
        </div>
        <button id="pdfBtn" class="button primary" type="button" disabled>PDF Oluştur</button>
      </div>
    </section>

    <!-- ARŞİV -->
    <section class="page" data-page="archive">
      <section class="panel">
        <div class="section-head">
          <div>
            <span class="eyebrow">ARŞİV</span>
            <h2>PDF'ler</h2>
          </div>
        </div>
        <div id="pdfArchive" class="pdf-archive"></div>
      </section>
    </section>

  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" type="button" data-page-target="home">
      <span class="nav-icon">⌂</span>
      <span>Ana Sayfa</span>
    </button>
    <button class="nav-item" type="button" data-page-target="scan">
      <span class="nav-icon">⌁</span>
      <span>Tara</span>
    </button>
    <button class="nav-item" type="button" data-page-target="pdf">
      <span class="nav-icon">▤</span>
      <span>PDF</span>
      <em id="navSelectedBadge" class="nav-badge hidden">0</em>
    </button>
    <button class="nav-item" type="button" data-page-target="archive">
      <span class="nav-icon">⌗</span>
      <span>Arşiv</span>
    </button>
  </nav>
</div>

<div id="cornerModal" class="corner-modal hidden" aria-hidden="true">
  <div class="corner-dialog">
    <div class="corner-head">
      <div>
        <span class="eyebrow">KÖŞELER</span>
        <h2>Fişi Düzelt</h2>
      </div>
      <button id="cornerClose" class="corner-close" type="button">✕</button>
    </div>

    <div id="cornerStage" class="corner-stage">
      <img id="cornerImage" alt="Orijinal fiş">
      <svg id="cornerSvg" class="corner-svg" preserveAspectRatio="none">
        <polygon id="cornerPolygon"></polygon>
      </svg>
      <button class="corner-handle" data-index="0"></button>
      <button class="corner-handle" data-index="1"></button>
      <button class="corner-handle" data-index="2"></button>
      <button class="corner-handle" data-index="3"></button>
    </div>

    <div class="corner-toolbar">
      <label>Görünüm
        <select id="scanMode">
          <option value="scan" selected>Tarama</option>
          <option value="color">Renkli</option>
          <option value="original">Doğal</option>
          <option value="gray">Gri</option>
          <option value="bw">Siyah / Beyaz</option>
        </select>
      </label>

      <div class="corner-actions">
        <button id="cornerCancel" class="button secondary" type="button">Vazgeç</button>
        <button id="cornerApply" class="button primary" type="button">Uygula</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/app.js?v=9"></script>
</body>
</html>
